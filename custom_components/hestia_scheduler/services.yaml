set_zone_schedule:
  name: Set Zone Schedule
  description: Replace the schedule for a specific day in a zone.
  fields:
    zone_id:
      name: Zone ID
      description: Identifier of the heating zone.
      required: true
      example: "downstairs"
      selector:
        text:
    day:
      name: Day
      description: Day of the week (mon, tue, wed, thu, fri, sat, sun).
      required: true
      example: "mon"
      selector:
        select:
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    slots:
      name: Slots
      description: >
        List of schedule slots. Each slot must have a time (HH:MM) and either
        a temperature (number) or a preset (home/away/eco/sleep/boost).
      required: true
      example: '[{"time": "07:30", "temperature": 20.0}, {"time": "22:00", "preset": "sleep", "preemptable": true}]'
      selector:
        object:

enable_zone:
  name: Enable Zone
  description: Enable scheduling for a zone.
  fields:
    zone_id:
      name: Zone ID
      description: Identifier of the heating zone.
      required: true
      example: "downstairs"
      selector:
        text:

disable_zone:
  name: Disable Zone
  description: Disable scheduling for a zone (heating is not turned off, just no longer automatically controlled).
  fields:
    zone_id:
      name: Zone ID
      description: Identifier of the heating zone.
      required: true
      example: "downstairs"
      selector:
        text:

skip_next_transition:
  name: Skip Next Transition
  description: Skip the next scheduled transition for a zone (useful for one-off manual overrides).
  fields:
    zone_id:
      name: Zone ID
      description: Identifier of the heating zone.
      required: true
      example: "downstairs"
      selector:
        text:

rename_zone:
  name: Rename Zone ID
  description: >
    Change the ID of a zone (the machine identifier used in MQTT topics,
    service calls and the card config, not the display name). The schedule,
    learned thermal data and entities are kept. Update any automations or
    dashboards that refer to the old ID.
  fields:
    zone_id:
      name: Current zone ID
      description: Current identifier of the heating zone.
      required: true
      example: "downstairs"
      selector:
        text:
    new_zone_id:
      name: New zone ID
      description: New identifier. Spaces become underscores; must not contain /, + or #.
      required: true
      example: "1"
      selector:
        text:

set_holiday:
  name: Set Holiday Mode
  description: Enable Holiday mode until a return date/time. Disabled zones are not changed.
  fields:
    until:
      name: Return date/time
      description: ISO 8601 date/time. Use this or Return text, not both.
      example: "2026-11-28T18:00:00+00:00"
      selector:
        text:
    until_text:
      name: Return text
      description: "Accepted examples: 3d, 2w, 36h, 28/11, 28/11 18:00, 28/11/2026 18:00."
      example: "28/11 18:00"
      selector:
        text:

clear_holiday:
  name: Clear Holiday Mode
  description: Cancel Holiday mode and immediately resume each enabled zone's normal schedule.

set_zone_holiday_target:
  name: Set Zone Holiday Target
  description: Set the preset or direct temperature used by one zone during Holiday mode.
  fields:
    zone_id:
      name: Zone ID
      required: true
      selector:
        text:
    preset:
      name: Preset
      description: Use this or Temperature, not both.
      selector:
        select:
          options:
            - home
            - away
            - eco
            - sleep
            - boost
            - comfort
    temperature:
      name: Temperature
      description: Use this or Preset, not both.
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: °C
